name: Release

# Two ways to release, both end the same: tag vX.Y.Z, image
# ghcr.io/<owner>/updock:X.Y.Z, :X.Y, :X and :latest (amd64 + arm64), and a
# GitHub release whose notes are generated by git-cliff (cliff.toml) from
# the Conventional Commits since the previous tag.
#   - push a tag:  git tag vX.Y.Z && git push origin vX.Y.Z
#   - or, without a local push: Actions -> Release -> Run workflow, "X.Y.Z"
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, without the v (e.g. 0.2.0)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: v
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::version must look like 1.2.3, got '$VERSION'"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test
        run: python -I updock.py --selftest

      - name: Tag (manual run only)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "updock v$VERSION"
          git push origin "v$VERSION"

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.v.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.v.outputs.version }}
            type=semver,pattern={{major}},value=v${{ steps.v.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.v.outputs.version }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: updock v${{ steps.v.outputs.version }}
          body: ${{ steps.cliff.outputs.content }}
